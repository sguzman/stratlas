name: Build and deploy Stratlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust and wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/hud-theme.js
          node --check web/zoning.js
          node --check web/census.js
          node --check web/parcel.js
          node --check web/data-cache.js
          node --check web/grid.js
      - name: Test API overlay scope and lifecycle
        run: node --test tests/zoning.test.mjs tests/census.test.mjs tests/data-cache.test.mjs tests/grid.test.mjs tests/sources.test.mjs tests/ontology.test.mjs tests/governance.test.mjs tests/readable-docs.test.mjs tests/hud-theme.test.mjs tests/ui-contract.test.mjs tests/parcel.test.mjs tests/basemaps.test.mjs
      - name: Test spatial core
        run: cargo test --workspace
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WebAssembly spatial core
        run: wasm-pack build crates/stratlas-core --release --target web --out-dir ../../web/pkg
      - name: Stamp static browser asset versions
        run: python3 scripts/stamp_assets.py "${GITHUB_SHA}"
      - name: Verify static build files
        run: |
          test -f web/index.html
          test -f web/pkg/stratlas_core.js
          test -f web/pkg/stratlas_core_bg.wasm
          grep -q "app.js?v=${GITHUB_SHA}" web/index.html
          grep -q "hud-theme.js?v=${GITHUB_SHA}" web/index.html
          grep -q "stratlas_core_bg.wasm?v=${GITHUB_SHA}" web/pkg/stratlas_core.js
      - name: Headless browser startup and grid smoke test
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1 maplibre-gl@5.5.0
          python3 -m http.server 8765 --directory web >/tmp/stratlas-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tests/browser-smoke.mjs
      - name: Live LA zoning browser API integration
        timeout-minutes: 3
        run: |
          python3 -m http.server 8765 --directory web >/tmp/stratlas-zoning-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.2
          done
          node tests/zoning-live.mjs
      - name: Live LA assessor parcel browser integration
        timeout-minutes: 4
        run: |
          python3 -m http.server 8765 --directory web >/tmp/stratlas-parcels-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.2
          done
          node tests/parcel-live.mjs
      - name: Live USGS raster tile availability
        timeout-minutes: 2
        run: |
          python3 -m http.server 8765 --directory web >/tmp/stratlas-usgs-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.2
          done
          node tests/usgs-live.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: https://sguzman.github.io/stratlas/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
